version: 1

# Semantic mapping only. Actual TencentDB endpoint/asset_type names live in
# ai/bin/lib/memory/tencentdb.py, grounded in upstream-notes.md — never invented here.
mappings:
  - name: shared
    source: ai/shared/**
    asset_type: wiki
    visibility: team

  - name: repositories
    source: ai/repos/<repo>/**
    asset_type: wiki
    visibility: team
    team_id_from: repo

  - name: domains
    source: ai/domains/**
    asset_type: wiki
    visibility: team

  - name: source_code
    source: apps/<repo>
    asset_type: code_graph
    visibility: team
    note: >
      Only stable, mergeable repositories under apps/<repo> are ever mapped — never
      worktrees/<TICKET_ID>/<repo>. Requires apps/<repo> to have a public https://
      origin remote; see upstream-notes.md "Hard limitation: CodeGraph cannot index
      a local path". memory-sync reports supports_code_graph=false rather than
      attempting or faking indexing when the remote isn't https.

  - name: accepted_task_experience
    source: ai/tasks/<ID>
    asset_type: chat_memory
    visibility: task
    precondition: "state.status == completed AND acceptance.status == accepted"
    note: >
      Only approved entries from ai/tasks/<ID>/knowledge-updates.json are ever
      published, never raw task.md/implementation.json/review.json/diffs/logs.

exclude:
  - worktrees/**
