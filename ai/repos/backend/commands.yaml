version: 1
package_manager: npm
commands:
  install-check:
    command: npm ci
    required: false
    timeout_seconds: 600
  lint:
    command: npm run lint
    required: true
    timeout_seconds: 300
  typecheck:
    command: npm run typecheck
    required: true
    timeout_seconds: 300
  test:
    command: npm run test
    required: true
    timeout_seconds: 900
  build:
    command: npm run build
    required: true
    timeout_seconds: 900
  export-openapi:
    command: npm run export:openapi
    required: true
    timeout_seconds: 300
    requires_infra: true
    # Needs the app's full Nest DI graph to build (Postgres/Redis), even though it never
    # binds an HTTP port. ai/bin/validate provisions/reuses this task's own isolated infra
    # stack (see ai/bin/lib/docker_infra.py) and injects its ports as env vars before running
    # this command — apps/backend/.env is never modified.
  test-architecture:
    command: npm run test:architecture
    required: true
    timeout_seconds: 300
  test-e2e:
    command: npm run test:e2e
    required: true
    timeout_seconds: 900
    requires_infra: true
    # Requires Postgres/Redis/MinIO. ai/bin/validate provisions/reuses this task's own
    # per-task infra stack automatically (isolated ports/volumes/network, migrated once on
    # first use) — no manual docker-compose step or shared .env edit needed. Promoted from
    # optional to required after the round-2 Codex review: this is the only test that
    # exercises the real create -> upload -> confirm -> BullMQ worker -> ready/failed flow
    # end to end.
  migration-run:
    command: npm run migration:run
    required: true
    timeout_seconds: 300
    requires_infra: true
    # Same infra precondition as test-e2e, auto-provisioned. Required after MEMORIES-0002
    # cycle-1 review flagged that AC37 ("migration runs on an empty database") was only ever
    # self-reported, never captured as deterministic evidence for the cycle being reviewed.
  migration-revert:
    command: npm run migration:revert
    required: true
    timeout_seconds: 300
    requires_infra: true
    # Task-level validation order runs migration-run, then this, then migration-run again
    # before test-e2e — proves both up() and down() work. Each task's database is its own
    # isolated volume (see ai/bin/lib/docker_infra.py), not a database shared across tasks,
    # so this no longer needs to leave shared state migrated for "whatever runs next".
# Cập nhật theo apps/backend/package.json thực tế (NestJS monorepo, npm workspaces).
# `build` dùng "nest build" mặc định (project gốc "api" trong nest-cli.json); build từng app
# riêng qua "npm run build:worker" / "build:realtime" / "build:scheduler" / "build:cli" khi cần.
